# Go modules are published by the tag itself: once v1.2.3 is pushed (the tag
# pnpm sdk:sync-public sets), `go get github.com/Crafvy/crafvy-go@v1.2.3`
# works and the Go module proxy / pkg.go.dev pick it up on first request.
# This workflow only proves the tagged code, and asks the proxy to fetch it
# so pkg.go.dev shows the version straight away. No secret needed.
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Tests (the shared conformance suite)
        run: go vet ./... && go test ./...
      - name: The tag is the package's version
        run: test "v$(sed -n 's/^const Version = "\(.*\)"/\1/p' version.go)" = "$GITHUB_REF_NAME"
      - name: Announce the version to the Go module proxy
        run: curl -fsS "https://proxy.golang.org/github.com/!crafvy/crafvy-go/@v/${GITHUB_REF_NAME}.info"
